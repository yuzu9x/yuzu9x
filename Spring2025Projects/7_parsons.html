<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    
    <title>yuzu9x - Parsons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', sans-serif;
        }

        body {
            background-color: #FFF9F9;
            color: #1A1A1A;
            line-height: 1.6;
            min-height: 150vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        nav {
            width: 100%;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
        }

        nav ul {
            display: flex;
            flex-direction: row;
            list-style: none;
            gap: clamp(3.5rem, 6vw, 5rem);
            position: relative;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #1A1A1A;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: lowercase;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            padding: 0.5rem 2rem;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .title-section {
            text-align: center;
            margin: 2rem 0 4rem 0;
            padding: 0 1rem;
        }

        .title-section h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #1A1A1A;
            font-weight: 300;
            letter-spacing: 4px;
        }

        footer {
            background-color: #FEF6F6;
            color: #000000;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        footer p {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .canvas-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 2rem auto;
            flex-wrap: wrap;
            padding-bottom: 60px;
            margin-bottom: 60px;
        }

        .canvas-container {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            height: 600px; 
            background: rgb(0, 0, 0);
            padding: 1rem;
            border: 3px dotted #FFE4E8;
            border-radius: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
        }

        #canvas3 {
            display: none; 
        }

        @media (max-width: 768px) {
            .canvas-row {
                flex-direction: column;
                align-items: center;
            }

            .canvas-container {
                width: 100%;
                max-width: 500px;
            }
        }

        /* Potato Quiz Styles */
        .quiz-container {
            background-color: #fff;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 80px auto;
        }
        
        .start-screen, .question-container, .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .potato-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
            margin-bottom: 30px;
        }
        
        .potato-box {
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #cec3d2;
        }
        
        .potato-box img {
            max-width: 100%;
            max-height: 120px;
            object-fit: contain;
        }
        
        .btn {
            background-color: #d7cde4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #dfccf1;
        }
        
        .question-container {
            display: none;
        }
        
        .question {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 10px;
            width: 100%;
        }
        
        .option {
            background-color: #f0e3f9;
            border: 2px solid #7e7292;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:hover {
            background-color: #f5e5f6;
            transform: translateY(-2px);
        }
        
        .progress {
            width: 100%;
            height: 10px;
            background-color: #c1bcd2;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #d7c8e4;
            width: 0%;
            transition: width 0.3s;
        }
        
        .result-container {
            display: none;
            text-align: center;
        }
        
        .result-image {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #d0cbd8;
        }
        
        .result-image img {
            max-width: 180px;
            max-height: 180px;
            object-fit: contain;
        }
        
        .result-title {
            font-size: 28px;
            color: #604873;
            margin-bottom: 15px;
        }
        
        .result-description {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="../index.html">home</a></li>
            <li><a href="../about.html">about</a></li>
            <li><a href="../portfolio.html">portfolio</a></li>
            <li><a href="../shop.html">shop</a></li>
            <li><a href="../parsons.html">parsons</a></li>
            <li><a href="../contact.html">contact</a></li>
        </ul>
    </nav>
    
    <div class="title-section">
        <h1>week 10: Potato Quiz</h1>
        <p>Prototype Only. for now...</p>
        <h3>What Potato are You</h3>
    </div>

    <!-- Potato Quiz Content -->
    <div class="quiz-container">
        <div class="start-screen">
            <div class="potato-grid">
                <div class="potato-box">
                    <img src="https://via.placeholder.com/150" alt="Russet Potato">
                </div>
                <div class="potato-box">
                    <img src="https://via.placeholder.com/150" alt="Sweet Potato">
                </div>
                <div class="potato-box">
                    <img src="https://via.placeholder.com/150" alt="Yukon Gold">
                </div>
                <div class="potato-box">
                    <img src="https://via.placeholder.com/150" alt="Purple Potato">
                </div>
            </div>
            <p>WHAT POTATO ARE YOU</p>
            <button class="btn" id="start-btn">Start Quiz</button>
        </div>
        
        <div class="question-container">
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            <div class="question" id="question-text"></div>
            <div class="options" id="options-container"></div>
        </div>
        
        <div class="result-container">
            <div class="result-image">
                <img id="result-img" src="https://via.placeholder.com/200" alt="Your Potato Type">
            </div>
            <h2 class="result-title" id="result-title">Your Potato Type</h2>
            <p class="result-description" id="result-description">Description about potato</p>
            <button class="btn" id="restart-btn">Take Quiz Again</button>
        </div>
    </div>

    <!-- Footer Section -->
    <footer id="footer">
        <div class="footer-container">
            <p>© yuzu9x. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="./7_parsons.js"></script>
</body>
</html>
