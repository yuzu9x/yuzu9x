<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
  <title>putting on my shoes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Apple Chancery', sans-serif;
    }

    body {
      background-color: #cbf7ec;
      color: #1A1A1A;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
      cursor: none;
    }

    /* Scalloped trim borders */
    /* Using circles and cutting them off at the top and bottom haha */
    body::before,
    body::after {
      content: '';
      position: fixed;
      left: 0;
      width: 100%;
      height: 20px;
      background-repeat: repeat-x;
      background-size: 40px 40px;
      background-position: top;
      background-image: radial-gradient(circle 20px at 20px 20px, #000 20px, transparent 21px);
      z-index: 1000;
    }

    body::before { top: 0; transform: rotate(180deg); }
    body::after { bottom: 0; }

    .back-button {
      position: absolute;
      top: 2rem;
      right: 2rem;
      text-decoration: none;
      color: #1A1A1A;
      font-weight: 300;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      z-index: 20;
    }

    .back-button img { width: 250px; height: 250px; object-fit: contain; transition: transform 0.3s ease; }
    .back-button:hover img { transform: scale(1.1); }

    .title-section { text-align: center; margin-top: 3rem; padding: 0 1rem; z-index: 5; }
    .title-section h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); color: #1A1A1A; font-weight: 300; letter-spacing: 3px; margin-bottom: 0.5rem; }
    .title-section p { font-size: clamp(1rem, 2.5vw, 1.5rem); color: #1A1A1A; font-weight: 200; letter-spacing: 1px; font-style: italic; }

    .canvas-grid { display: grid; place-items: center; margin-top: 2rem; flex-grow: 1; width: 100%; }
    .canvas-box { padding: 0; background: none; border-radius: 0; box-shadow: none; backdrop-filter: none; }
    .canvas-box canvas { display: block; border-radius: 0; }

    /* Glitter particles */
    .glitter-particle { position: fixed; pointer-events: none; z-index: 9999; width: 8px; height: 8px; background: radial-gradient(circle, #ffc0cb, #ffb6c1, #f8bbd9); border-radius: 50%; box-shadow: 0 0 6px #ffc0cb, 0 0 12px #ffb6c1, 0 0 18px #f8bbd9; animation: glitter-fade 1.5s ease-out forwards; }
    .glitter-star { position: fixed; pointer-events: none; z-index: 9999; color: #ffc0cb; font-size: 12px; text-shadow: 0 0 6px #ffc0cb, 0 0 12px #ffb6c1; animation: star-twinkle 1.2s ease-out forwards; }

    @keyframes glitter-fade { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0.3) rotate(180deg); } }
    @keyframes star-twinkle { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(90deg); } 100% { opacity: 0; transform: scale(0.5) rotate(180deg); } }

    .custom-cursor { position: fixed; width: 20px; height: 20px; background: radial-gradient(circle, #ffc0cb, #ffb6c1); border-radius: 50%; pointer-events: none; z-index: 9998; box-shadow: 0 0 10px #ffc0cb, 0 0 20px #ffb6c1, 0 0 30px #f8bbd9; transition: transform 0.1s ease; }

    /* Floating phrases across the screen*/
    #floatingContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .floating-phrase { position: absolute; white-space: nowrap; font-size: 1.2rem; color: #1A1A1A; opacity: 0; pointer-events: none; transition: opacity 3s ease; }

    @media (max-width: 768px) {
      .back-button { top: 1rem; right: 1rem; }
      .back-button img { width: 150px; height: 150px; }
      .title-section { margin-top: 2rem; }
      .canvas-box { padding: 0; }
    }
  </style>
</head>
<body>
  <!-- Custom cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- Back Button -->
  <a href="../Fall2025Projects/1_parsons.html" class="back-button">
    <img src="../Fall2025Projects/Fall2025Images/Back.gif" alt="Back">
  </a>

  <!-- Title Section -->
  <div class="title-section">
    <h2>put my shoes on for me please</h2>
    <p>i can't move my limbs but i need to go outside!!!</p>
  </div>

  <!-- Canvas Container -->
  <div class="canvas-grid">
    <div class="canvas-box" id="canvas1"></div>
  </div>

  <!-- Floating phrases container -->
  <div id="floatingContainer"></div>

  <script src="./closet.js"></script>
  <script>
    // Cursor glitter
    const customCursor = document.getElementById('customCursor');
    document.addEventListener('mousemove', e => {
      customCursor.style.left = e.clientX - 10 + 'px';
      customCursor.style.top = e.clientY - 10 + 'px';
      if (Math.random() < 0.3) createGlitterParticle(e.clientX, e.clientY);
    });
    document.addEventListener('mouseleave', () => customCursor.style.opacity = '0');
    document.addEventListener('mouseenter', () => customCursor.style.opacity = '1');

    function createGlitterParticle(x, y) { Math.random() < 0.4 ? createStarParticle(x, y) : createCircleParticle(x, y); }
    function createCircleParticle(x, y) { 
      const p = document.createElement('div'); p.className='glitter-particle';
      p.style.left = (x + (Math.random()-0.5)*40) + 'px';
      p.style.top = (y + (Math.random()-0.5)*40) + 'px';
      const s = 4 + Math.random()*8; p.style.width=s+'px'; p.style.height=s+'px';
      document.body.appendChild(p); setTimeout(()=>p.remove(),1500);
    }
    function createStarParticle(x, y){
      const p=document.createElement('div');p.className='glitter-star';p.innerHTML='✦';
      p.style.left=(x+(Math.random()-0.5)*50)+'px';p.style.top=(y+(Math.random()-0.5)*50)+'px';
      p.style.fontSize=(8+Math.random()*8)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1200);
    }

    document.addEventListener('DOMContentLoaded', ()=>{if(typeof sketch!=='undefined') new p5(sketch,"canvas1");});

    // Floating phrases
    const floatingContainer = document.getElementById("floatingContainer");
    const phrases = [
      "these heels hurt my feet...",
      "ouch ouch ouch ouch ｡+.｡☆ﾟ:;｡+ﾟ ☆*ﾟ¨ﾟﾟ･*:..ﾞ((ε(*⌒▽⌒)†",
      "please consider the most appropriate shoetype for someone to be able to walk long distances in",
      "i have to walk a lot today . . . :ﾟ(｡ﹷ ‸ ﹷ ✿)",
      "do u guys like my shoes i worked very hard on them （✿ ͡◕ ᴗ◕)つ━━✫・*。"
    ];

    function createFloatingPhrase(text, topOffset, speed){
      const span=document.createElement("span");
      span.className="floating-phrase";
      span.textContent=text;
      span.style.top=`${topOffset}vh`;
      span.style.left=`0px`;
      floatingContainer.appendChild(span);

      // delay fade-in time
      setTimeout(()=>{span.style.opacity="0.7";},10000);

      let pos=0;
      function animate(){
        pos+=speed;
        span.style.left=pos+'px';
        if(pos>window.innerWidth+200) pos=-span.offsetWidth;
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Create the phrases with staggered positions + random speeds
    phrases.forEach((text,i)=>{
      const topOffset=20 + i*15;
      const speed=0.3 + Math.random()*0.2;
      createFloatingPhrase(text,topOffset,speed);
    });
  </script>
</body>
</html>
